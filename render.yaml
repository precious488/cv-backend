      - key: JWT_ACCESS_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          name: craft-redis
          type: redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ─── Document Service ─────────────────────────────────────────
  - type: web
    name: craft-document-service
    env: node
    region: oregon
    plan: free
    buildCommand: >
      cd shared && npm install && npm run build && cd ../services/document-service &&
