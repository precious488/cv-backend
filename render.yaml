      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: user-profile-service
      - key: PORT
        value: 3002
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          name: craft-redis
          type: redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ─── CV Service ───────────────────────────────────────────────
  - type: web
    name: craft-cv-service
    env: node
    region: oregon
    plan: free
    buildCommand: >
      cd shared && npm install && npm run build && cd ../services/cv-service &&
      npm install --include=dev &&
