services:
  # ─── Redis ────────────────────────────────────────────────────
  - type: redis
    name: craft-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: "0.0.0.0/0"
        description: "allow all traffic"

  # ─── API Gateway ──────────────────────────────────────────────
  - type: web
    name: craft-api-gateway
    env: node
    region: oregon
    plan: free
    buildCommand: >
      cd shared && npm install && npm run build && cd ../api-gateway &&
      npm install --include=dev &&
      rm -rf node_modules/@craft/shared &&
      mkdir -p node_modules/@craft/shared &&
      cp -r ../shared/dist node_modules/@craft/shared/dist &&
      cp -r ../shared/src node_modules/@craft/shared/src &&
      cp ../shared/package.json node_modules/@craft/shared/package.json &&
      npm run build
    startCommand: cd api-gateway && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: api-gateway
      - key: PORT
        value: 4000
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          name: craft-redis
          type: redis
          property: connectionString
      - key: AUTH_SERVICE_URL
        sync: false
      - key: PROFILE_SERVICE_URL
        sync: false
      - key: CV_SERVICE_URL
        sync: false
      - key: DOCUMENT_SERVICE_URL
        sync: false
      - key: ATS_SERVICE_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ─── Auth Service ─────────────────────────────────────────────
  - type: web
    name: craft-auth-service
    env: node
    region: oregon
    plan: free
    buildCommand: >
      cd shared && npm install && npm run build && cd ../services/auth-service &&
      npm install --include=dev &&
      rm -rf node_modules/@craft/shared &&
      mkdir -p node_modules/@craft/shared &&
      cp -r ../../shared/dist node_modules/@craft/shared/dist &&
      cp -r ../../shared/src node_modules/@craft/shared/src &&
      cp ../../shared/package.json node_modules/@craft/shared/package.json &&
      npm run build
    startCommand: cd services/auth-service && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: auth-service
      - key: PORT
        value: 3001
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: REDIS_URL
        fromService:
          name: craft-redis
          type: redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false

